<!--
base.html
Plantilla base del proyecto.

Responsabilidad:
- Define la estructura común de la página.
- Centraliza la navegación.
- Muestra enlaces según el estado de autenticación.
- El resto de plantillas heredan de esta.
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Order Management{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'miapp:home' %}">Home</a>
            <a href="{% url 'miapp:order_list' %}">Orders</a>

            {% if user.is_authenticated %}
                <a href="{% url 'miapp:order_create' %}">Create order</a>

                <span>Logged in as {{ user.username }}</span>

                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'miapp:signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
